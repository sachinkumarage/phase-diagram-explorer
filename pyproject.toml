[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phase-diagram-explorer"
version = "0.1.4"
description = "Interactive exploration and visualization of thermodynamic phase diagrams"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "plotly",
    "streamlit",
    "pydantic",
    "pyyaml",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fast local default; run everything with: pytest -m "slow or not slow"
addopts = ["--strict-markers", "-m", "not slow"]
markers = [
    "slow: full-range invariant detection and headless Streamlit app tests (deselected by default; run in CI)",
]
