[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phase-diagram-explorer"
version = "1.0.0"
description = "Interactive exploration and visualization of thermodynamic phase diagrams"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "plotly",
    "streamlit",
    "pydantic",
    "pyyaml",
]

[project.optional-dependencies]
# Test runner (not needed to run the app; never in requirements.txt).
dev = ["pytest"]
# Cross-validation of the equilibrium engine (tests/validation, marker "validation").
validation = ["pycalphad"]

[project.scripts]
phase-diagram-explorer = "phase_diagram_explorer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fast local default; run everything with: pytest -m ""
addopts = ["--strict-markers", "-m", "not slow and not validation and not network"]
markers = [
    "slow: full-range invariant detection and headless Streamlit app tests (deselected by default; run in CI)",
    "validation: cross-validation against pycalphad (needs .[validation]; deselected by default; own CI job)",
    "network: downloads from official URLs (deselected by default; run with -m network; CI runs them)",
]
# Any warning raised from this package's own code fails the test suite.
filterwarnings = ["ignore::DeprecationWarning:pycalphad.*", "error:::phase_diagram_explorer"]
