name: Tests

on:
  push:
  pull_request:

# Thermodynamic databases are downloaded from their official URLs
# (data/sources.json) and verified by SHA256; they are never committed.
# data/tdb/ is cached under a key derived from data/sources.json, which holds
# each file's SHA256. If a download fails and nothing is cached, the fetch
# step fails the job with the error from scripts/fetch_tdb.py. The test jobs
# also run the "network" tests, which download from the official URL through
# the real fetch code path.

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # every Python version reports its own result; one failing does not cancel the other
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test tools
        run: pip install -e ".[dev]"

      - name: Restore downloaded databases
        uses: actions/cache@v6
        with:
          path: data/tdb
          key: tdb-${{ hashFiles('data/sources.json') }}

      - name: Fetch and verify databases (fails the job if unavailable)
        run: python scripts/fetch_tdb.py

      - name: Check precomputed diagrams are up to date
        run: python scripts/precompute.py --check

      - name: Run full test suite (including slow and network tests)
        run: pytest -q -m "not validation"

  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package with pycalphad
        run: pip install -e ".[dev,validation]"

      - name: Restore downloaded databases
        uses: actions/cache@v6
        with:
          path: data/tdb
          key: tdb-${{ hashFiles('data/sources.json') }}

      - name: Fetch and verify databases (fails the job if unavailable)
        run: python scripts/fetch_tdb.py

      - name: Cross-validate the engine against pycalphad
        run: pytest -q -m validation

  cloud-smoke:
    # Simulates Streamlit Community Cloud: a fresh virtual environment with
    # only requirements.txt, then the AppTest smoke test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install from requirements.txt in a fresh virtual environment
        run: |
          python -m venv /tmp/cloud
          /tmp/cloud/bin/pip install -r requirements.txt

      - name: App smoke test with the database unavailable (downloads disabled)
        shell: bash  # with pipefail, so a failing test fails the step through tee
        run: |
          /tmp/cloud/bin/python scripts/smoke_test.py --offline | tee smoke_offline.txt
          { echo '### App smoke test without the database'; echo '```'; cat smoke_offline.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore downloaded databases
        uses: actions/cache@v6
        with:
          path: data/tdb
          key: tdb-${{ hashFiles('data/sources.json') }}

      - name: Fetch and verify databases (fails the job if unavailable)
        run: /tmp/cloud/bin/python scripts/fetch_tdb.py

      - name: App smoke test (records cold-start time)
        shell: bash  # with pipefail, so a failing test fails the step through tee
        run: |
          /tmp/cloud/bin/python scripts/smoke_test.py | tee smoke.txt
          { echo '### App smoke test (fresh install from requirements.txt)'; echo '```'; cat smoke.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
