name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test tools
        run: pip install -e ".[dev]"

      - name: Check precomputed diagrams are up to date
        run: python scripts/precompute.py --check

      - name: Run full test suite (including slow tests)
        run: pytest -q -m "not validation"

  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with pycalphad
        run: pip install -e ".[dev,validation]"

      - name: Cross-validate the engine against pycalphad
        run: pytest -q -m validation

  cloud-smoke:
    # Simulates Streamlit Community Cloud: a fresh virtual environment with
    # only requirements.txt, then the AppTest smoke test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install from requirements.txt in a fresh virtual environment
        run: |
          python -m venv /tmp/cloud
          /tmp/cloud/bin/pip install -r requirements.txt

      - name: App smoke test (records cold-start time)
        shell: bash  # with pipefail, so a failing test fails the step through tee
        run: |
          /tmp/cloud/bin/python scripts/smoke_test.py | tee smoke.txt
          { echo '### App smoke test (fresh install from requirements.txt)'; echo '```'; cat smoke.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
